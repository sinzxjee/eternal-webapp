<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#110e25"><title>ETERNAL · Chơi đơn</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32205a,#100d20 70%);color:#f6f0ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:640px;margin:auto;padding:20px 16px 100px}h1{letter-spacing:5px;text-align:center;color:#f2d795;margin:20px 0 0}small,.muted{color:#bcb0d0}.sub{text-align:center;margin:0 0 25px;font-size:12px;letter-spacing:2px}.panel{background:#211b39;border:1px solid #5b477b;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 25px #0003}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#302649;border-radius:12px;padding:12px}.stat strong{display:block;font-size:23px;color:#ffe6a2}button{font:inherit;border:0;border-radius:12px;background:linear-gradient(120deg,#8e60dd,#5634a1);color:white;padding:13px 14px;cursor:pointer;font-weight:700}button:disabled{opacity:.45}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}nav button{font-size:12px;padding:12px 4px}nav button.active{background:linear-gradient(120deg,#d4a34c,#906323);color:#160f26}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0}.row button{font-size:12px;padding:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{background:#392b58;border:1px solid #8060a3;border-radius:12px;min-height:94px;padding:12px 4px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px}.card strong{font-size:25px}.wide{width:100%;margin-top:10px}.log{white-space:pre-wrap;font-size:13px;color:#ddcfea;line-height:1.6}.tag{color:#e4c477;font-weight:700}input,select,textarea{background:#130e28;color:white;border:1px solid #6d558c;padding:12px;border-radius:10px;max-width:100%} .pill{display:in utton></div><button class="wide" onclick="exportSave()">⬇️ Xuất bản lưu JSON</button><label class="wide" style="display:block;margin-top:12px">📥 Nhập bản lưu JSON <input style="width:100%;margin-top:8px" type="file" accept="application/json,.json" onchange="importSave(event)"></label><p class="muted" style="font-size:12px">Chơi đơn và lưu trên trình duyệt hiện tại. Xuất JSON để sao lưu hoặc chuyển máy.</p></section></main><script>
const initial={cash:892,cards:83,ex:6,ur:20,ssr:3,evo:16,fusion3:1,voidCrystal:1,chests:2,trainerExp:0,trainerLv:1,streak:0,pity:0,questGacha:0,questStages:0,round:21,boss20:true,stage:0,eggs:0,eggHatches:0,history:[]};let state;try{state={...initial,...JSON.parse(localStorage.getItem('eternal-mobile-test-v1')||'{}')}}catch{state={...initial}};let page='home',picked=[],revealed=false,draw=[];const menus=[['home','🏠 Trang chủ'],['gacha','🎰 Gacha'],['collection','🎴 BST'],['world','🗺️ 150 ải'],['boss','🐉 Boss'],['fusion','🧬 Dung hợp'],['egg','🥚 Trứng'],['tower','🏰 Tháp'],['pve','⚔️ PvE'],['craft','⚒️ Chế tạo'],['dex','📖 Pokédex'],['quests','📜 Nhiệm vụ'],['profile','⭐ Huấn luyện'],['admin','💻 Admin']];function save(){localStorage.setItem('eternal-mobile-test-v1',JSON.stringify(state));render()}function go(p){page=p;picked=[];revealed=false;draw=[];render()}function render(){document.getElementById('cash').textContent=state.cash+'$';document.getElementById('cards').textContent=state.cards;document.getElementById('rare').textContent=state.ex+' / '+state.ur;document.getElementById('shards').textContent=state.ssr+' / '+state.fusion3;document.getElementById('nav').innerHTML=menus.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('');let h='';if(page==='home')h='<h2>🌌 Chào mừng đến ETERNAL</h2><p>Thử giao diện, lưu dữ liệu, Gacha và các menu. Các hệ thống nâng cao được giới thiệu nhưng chưa mô phỏng đầy đủ.</p><p class="tag">Không có vật phẩm nào bị trừ khi mở ứng dụng.</p>';if(page==='gacha'){h=`<h2>🎰 Gacha vòng ${state.round}</h2><p>Giá 50$ ảo · Chọn 3 trong 9 lá bài.</p><p class='mini'>🎯 Bảo hiểm SSR: ${state.pity||0}/10 vòng chưa trúng SSR+ · Chuỗi: ${state.streak||0}</p><label class='mini'>🍀 May mắn <select id='luck' onchange='renderGachaCost()'><option value='0'>Thường · 50$</option><option value='10'>x2 · 60$</option><option value='25'>x3 · 75$</option><option value='50'>x5 · 100$</option></select></label><div class="grid">${Array.from({length:9},(_,i)=>`<button class="card" onclick="pick(${i})" ${revealed?'disabled':''}>${revealed?'<strong>'+draw[i].icon+'</strong>'+draw[i].tier:(picked.includes(i)?'✨ Đã chọn':'❔')}</button>`).join('')}</div><p>Đã chọn ${picked.length}/3</p><button class="wide" ${picked.length!==3||revealed||state.cash<50?'disabled':''} onclick="roll()">🎲 Mở 3 thẻ (phí theo may mắn)</button>`;if(revealed)h+='<p class="tag">Đã lưu kết quả. Ấn Gacha trên menu để mở vòng kế tiếp.</p><p class="mini">Thẻ bạn chọn được ghi vào BST theo bậc. 6 thẻ còn lại chỉ là kết quả minh họa.</p>'}if(page==='collection')h=`<h2>🎴 Bộ sưu tập</h2><p>Tổng: ${state.cards} thẻ</p><p>💠 EX: ${state.ex} · 👑 UR: ${state.ur} · 🌟 SSR: ${state.ssr}</p><p>Các thẻ thấp hơn: ${state.cards-state.ex-state.ur-state.ssr}</p><p class="muted">Bản test chỉ lưu số lượng, chưa khôi phục toàn bộ danh sách 83 Pokémon.</p>`;if(page==='world')h=`<h2>🗺️ Thế giới 150 ải</h2><p>15 vùng × 10 ải · Tiến độ bản test: ${state.stage}/150</p><button class="wide" onclick="battleStage()">⚔️ Thử vượt ải ${state.stage+1}</button><p class="muted">Bản thử nghiệm: mỗi ải thắng nhận 15$ ảo, không mô phỏng kỹ năng chi tiết.</p>`;if(page==='boss')h='<h2>🐉 World Boss</h2><p>Oblivion – Thần Long Hủy Diệt</p><p>❤️ 50.000 HP · ⚔️ 900 ATK · 12 hiệp</p><p>Boss Gacha vòng 20: <span class="tag">Đã chiến thắng</span></p><p class="muted">Trận World Boss theo hiệp sẽ được hoàn thiện ở bản sau.</p>';if(page==='fusion')h=`<h2>🧬 Dung hợp</h2><p>10 UR → 1 EX cần 1 Mảnh Dung Hợp bậc 3.</p><p>UR hiện có: ${state.ur} · Mảnh bậc 3: ${state.fusion3}</p><p class="tag">Chưa thực hiện: cần chọn đúng 10 thẻ UR và xác nhận riêng.</p><p class="muted">Công thức 10 R → 10 SR được giữ nguyên.</p>`;if(page==='egg')h=`<h2>🥚 Nhà ấp trứng</h2><p>Trứng đang có: ${state.eggs} · Đã ấp: ${state.eggHatches}</p><p class="muted">Chưa có trứng được cấp trong dữ liệu ban đầu.</p>`;if(page==='tower')h='<h2>🏰 Tháp Vô Tận</h2><p>Tầng khởi đầu: 1</p><p>Chọn đội hình và nhận Mảnh Dung Hợp từ các mốc vượt tầng trong phiên bản chiến đấu hoàn thiện.</p>';if(page==='pve')h='<h2>⚔️ Đấu trường PvE</h2><p>Hạng: Đồng III · Điểm: 0</p><p>Chế độ đối đầu đội hình AI đang được phát triển.</p>';if(page==='craft')h='<h2>⚒️ Xưởng chế tạo</h2><p>Kiếm Long Thần · Giáp Hư Không · Nhẫn Sinh Mệnh · Mega Stone</p><p>Chưa có nguyên liệu chế tạo được xác minh; không thể tự chế tạo.</p>';if(page==='dex')h='<h2>📖 Pokédex 585 loài</h2><p>C: 150 · UC: 125 · R: 100 · SR: 85</p><p>SSR: 60 · UR: 40 · EX: 25</p><p class="muted">585 là số loài mục tiêu, không phải số thẻ sở hữu.</p>';if(page==='quests')h=`<h2>📜 Nhiệm vụ</h2><p>🎰 Gacha: ${state.questGacha||0}/1 vòng</p><p>🗺️ Vượt ải: ${state.questStages||0}/3 ải</p><p class='mini'>Thưởng chỉ nhận một lần trong bản lưu này.</p><button class='wide' ${state.questGacha<1||state.claimGacha?'disabled':''} onclick='claimQuest("gacha")'>Nhận 20$ + 10 EXP Gacha</button><button class='wide' ${state.questStages<3||state.claimStages?'disabled':''} onclick='claimQuest("stages")'>Nhận 30$ + 20 EXP vượt ải</button>`;if(page==='profile')h=`<h2>⭐ Huấn luyện viên</h2><p>Cấp ${state.trainerLv||1} · ${state.trainerExp||0}/${100+25*((state.trainerLv||1)-1)} EXP</p><p>🌟 Mảnh tiến hóa: ${state.evo} · 💠 Mảnh dung hợp bậc 3: ${state.fusion3}</p><p>🎁 Rương Boss: ${state.chests} · 🌀 Hư Không Long Tinh: ${state.voidCrystal}</p><h3>📜 Nhật ký</h3><div class='feed mini'>${(state.history||[]).slice(-15).reverse().map(x=>'<p>• '+safeText(x)+'</p>').join('')||'Chưa có hoạt động mới.'}</div>`;if(page==='admin')h='<h2>💻 Cheat Console</h2><p>Mã thử nghiệm:</p><select id="cheat"><option value="ADD_1000">ADD_1000</option><option value="ADD_FUSION_T3">ADD_FUSION_T3</option></select><button class="wide" onclick="cheat()">⚡ Kích hoạt</button><p class="muted">Cheat chỉ thay đổi dữ liệu lưu trên thiết bị này.</p>';document.getElementById('screen').innerHTML=h}function pick(i){if(revealed)return;picked=picked.includes(i)?picked.filter(x=>x!==i):picked.length<3?[...picked,i]:picked;const luck=document.getElementById('luck')?.value;render();if(luck&&document.getElementById('luck'))document.getElementById('luck').value=luck;renderGachaCost()}function roll(){const bonus=Number(document.getElementById('luck')?.value||0);const cost=50+bonus;if(picked.length!==3||state.cash<cost||revealed)return;const tiers=[['C','🐾',3],['UC','🌿',6],['R','⚔️',12],['SR','✨',20],['SSR','🌟',20],['UR','👑',50],['EX','💠',80]];draw=Array.from({length:9},()=>{let r=Math.random(),factor=bonus===50?5:bonus===25?3:bonus===10?2:1;let j=r<(.43/factor)?0:r<(.69/factor)?1:r<(.84/factor)?2:r<(.94/factor)?3:r<(.985/factor)?4:r<(.998/factor)?5:6;return {tier:tiers[j][0],icon:tiers[j][1],reward:tiers[j][2]}});if((state.pity||0)>=9&&!picked.some(i=>['SSR','UR','EX'].includes(draw[i].tier)))draw[picked[0]]={tier:'SSR',icon:'🌟',reward:20};state.cash-=cost;let high=false;for(let i of picked){state.cards++;state.cash+=draw[i].reward;if(['SSR','UR','EX'].includes(draw[i].tier))high=true;if(draw[i].tier==='SSR')state.ssr++;if(draw[i].tier==='UR')state.ur++;if(draw[i].tier==='EX')state.ex++}state.pity=high?0:(state.pity||0)+1;state.streak=(state.streak||0)+1;state.questGacha=(state.questGacha||0)+1;state.history.push('Gacha '+state.round+': '+picked.map(i=>draw[i].tier).join(', '));state.round++;revealed=true;save()}function battleStage(){if(state.stage>=150)return;state.stage++;state.cash+=15;state.questStages=(state.questStages||0)+1;addExp(10);state.history.push('Vượt ải '+state.stage);save()}function safeText(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addExp(n){state.trainerExp=(state.trainerExp||0)+n;while(state.trainerExp>=100+25*((state.trainerLv||1)-1)){state.trainerExp-=100+25*((state.trainerLv||1)-1);state.trainerLv=(state.trainerLv||1)+1}}function claimQuest(q){if(q==='gacha'&&state.questGacha>=1&&!state.claimGacha){state.cash+=20;addExp(10);state.claimGacha=true}else if(q==='stages'&&state.questStages>=3&&!state.claimStages){state.cash+=30;addExp(20);state.claimStages=true}else return;state.history.push('Nhận thưởng nhiệm vụ '+q);save()}function importSave(event){const f=event.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||typeof data!=='object'||Array.isArray(data)||!['cash','cards','round'].every(k=>Number.isFinite(data[k])&&data[k]>=0)||!Array.isArray(data.history))throw Error('Định dạng bản lưu không hợp lệ');if(!confirm('Nhập bản lưu này? Dữ liệu hiện tại sẽ bị thay thế.'))return;state={...initial,...data};save();go('home')}catch(e){alert('Không thể nhập bản lưu: '+e.message)}};reader.readAsText(f)}function renderGachaCost(){const cost=50+Number(document.getElementById('luck')?.value||0);const b=document.querySelector('#screen button.wide');if(b){b.textContent='🎲 Mở 3 thẻ (−'+cost+'$ ảo)';b.disabled=picked.length!==3||revealed||state.cash<cost}}function cheat(){let c=document.getElementById('cheat').value;if(c==='ADD_1000')state.cash+=1000;else state.fusion3++;state.history.push('Cheat '+c);save()}function resetGame(){if(confirm('Khôi phục trạng thái gốc 892$ và 83 thẻ? Dữ liệu test hiện tại sẽ bị xóa.')){state={...initial};localStorage.removeItem('eternal-mobile-test-v1');go('home')}}function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eternal-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script><script>
// 8.0 additive systems; migrate the existing save without consuming assets.
const extraMenus=[['arena','🏟️ Đấu trường'],['relics','🔮 Cổ vật'],['achieve','🏅 Thành tựu'],['settings','⚙️ Cài đặt']];menus.splice(menus.findIndex(x=>x[0]==='admin'),0,...extraMenus);
function defaults8(){state.towerFloor ??=0;state.arenaWins ??=0;state.bossDamage ??=0;state.relicEquipped ??='';state.claimedAchievements ??=[];state.gachaHistory ??=[];state.settings ??={animations:true};state.version=8;}
defaults8();
const baseRender8=render;
render=function(){defaults8();baseRender8();let h='';
if(page==='home'){h=`<div class="hero"><h2>✦ ETERNAL 8.4 ✦</h2><p>BALANCE UPDATE · BỘ ẢNH 150 ID</p><div class="chips"><button onclick="go('gacha')">🎴 Mở thẻ</button><button onclick="go('world')">🗺️ Phiêu lưu</button><button onclick="go('quests')">📜 Nhiệm vụ</button></div></div><h3>📊 Tiến độ hành trình</h3><div class="card-tile">Gacha vòng ${state.round} · Thế giới ${state.stage}/150<div class="progress"><i style="width:${state.stage/150*100}%"></i></div>Tháp vô tận tầng ${state.towerFloor} · Đấu trường ${state.arenaWins} trận thắng</div><div class="notice good">🔐 Dữ liệu lưu trên thiết bị. Xuất JSON trước khi xóa Safari hoặc chuyển hosting.</div><h3>🎯 Nhiệm vụ nhanh</h3><p>Gacha ${state.questGacha}/1 · Vượt ải ${state.questStages}/3</p><p class="mini">Mọi đơn vị $ trong trò chơi đều là tiền ảo.</p>`}
if(page==='arena')h=`<h2>🏟️ Đấu trường PvE</h2><p>Hạng: Đồng III · Trận thắng: ${state.arenaWins}</p><p>Đấu tập với đội hình AI mô phỏng. Mỗi trận thắng: +10$ ảo, +10 EXP.</p><button class="wide" onclick="arenaFight()">⚔️ Đấu tập</button>`;
if(page==='relics')h=`<h2>🔮 Cổ vật thần thoại</h2><p>Chỉ trang bị tối đa 1 cổ vật. Hiện tại chưa có cổ vật nào được xác nhận trong kho.</p><div class="card-tile">👑 Vương Miện Sáng Thế · +15% sức mạnh đội</div><div class="card-tile">👁️ Hư Không Nhãn · −15% sát thương Boss</div><div class="card-tile">⌛ Đồng Hồ Vĩnh Hằng · thêm 1 hành động/trận</div><p class="notice">Không tự cấp hoặc trang bị vật phẩm chưa sở hữu.</p>`;
if(page==='achieve')h=`<h2>🏅 Thành tựu</h2><div class="card-tile">🐉 Diệt 5 Boss Gacha · Tiến độ 3/5</div><div class="card-tile">🎴 Nhà sưu tập · ${state.cards}/100 thẻ</div><div class="card-tile">🗺️ Nhà thám hiểm · ${state.stage}/10 ải</div><div class="card-tile">🏰 Người chinh phục · ${state.towerFloor}/10 tầng</div><p class="muted">Mốc chưa hoàn thành không tự nhận thưởng.</p>`;
if(page==='settings')h=`<h2>⚙️ Cài đặt & an toàn dữ liệu</h2><p>Phiên bản lưu: ${state.version} · Tiền ảo: ${state.cash}$</p><button class="wide" onclick="exportSave()">💾 Xuất JSON ngay</button><button class="wide" onclick="showDiagnostics()">🩺 Kiểm tra dữ liệu</button><p class="notice">Dùng nút xuất JSON trước khi chuyển từ Netlify sang GitHub Pages: hai tên miền không chia sẻ LocalStorage.</p><details><summary>Giới hạn bản test</summary><p>Trận chiến, chế tạo, dung hợp và mở rương chưa phải cơ chế hoàn chỉnh. Bản test không tự thực hiện các giao dịch này.</p></details>`;
if(page==='gacha'){const el=document.getElementById('screen');el.innerHTML=h||el.innerHTML;renderGachaCost();return}
if(h)document.getElementById('screen').innerHTML=h;
};
function arenaFight(){defaults8();const success=Math.random()<.75;if(success){state.arenaWins++;state.cash+=10;addExp(10)}state.history.push('Đấu trường PvE: '+(success?'thắng (+10$ ảo, +10 EXP)':'thua (không mất tài nguyên)'));save();alert(success?'Chiến thắng! +10$ ảo, +10 EXP':'Thua trận! Không mất tài nguyên.');}

function renderCounters82(){const eopts=elements82.map(x=>`<option>${x}</option>`).join('');const ropts=Object.keys(roles81).map(x=>`<option>${x}</option>`).join('');document.getElementById('screen').innerHTML=`<h2>⚔️ Khắc hệ & Khắc vai trò</h2><p class="type-note">Quy tắc cân bằng thử nghiệm ETERNAL 8.4. Được áp dụng trong chiến đấu chơi đơn.</p><div class="counter-grid"><label>Hệ tấn công<select id="counterAttack82" onchange="counterCalc82()">${eopts}</select></label><label>Hệ phòng thủ<select id="counterDefend82" onchange="counterCalc82()">${eopts}</select></label><label>Vai trò tấn công<select id="counterRoleA82" onchange="counterCalc82()">${ropts}</select></label><label>Vai trò phòng thủ<select id="counterRoleB82" onchange="counterCalc82()">${ropts}</select></label></div><div id="counterOutput82" class="counter-result"></div><h3>🌈 Bảng khắc hệ</h3>${Object.entries(counterEdges82).map(([a,b])=>`<div class="counter-rule">${a} <b>➜</b> ${b.join(', ')}</div>`).join('')}<p class="mini">Khắc hệ ×1.25; bị khắc ×0.85; trung lập ×1. Hai điểm yếu: tối đa ×1.40; vừa mạnh vừa yếu: ×1.0.</p><h3>🛡️ Bảng khắc vai trò</h3>${Object.entries(roleEdges82).map(([a,b])=>`<div class="counter-rule">${a} <b>➜</b> ${b.join(', ')}</div>`).join('')}<p class="mini">Khắc vai trò ×1.10; bị khắc ×0.92; trung lập ×1. Tổng lợi thế được giới hạn ×1.50.</p><p class="notice">Máy tính chỉ để thử chiến thuật, không tiêu hao thẻ hoặc tài nguyên.</p>`;document.getElementById('counterAttack82').value='Lửa';document.getElementById('counterDefend82').value='Mộc';document.getElementById('counterRoleA82').value='Pháp Sư';document.getElementById('counterRoleB82').value='Đỡ Đòn';counterCalc82()}
menus.splice(menus.findIndex(x=>x[0]==='monsters')+1,0,['counters','⚔️ Khắc chế']);const renderBefore82=render;render=function(){renderBefore82();if(page==='counters')renderCounters82();if(page==='monsters'){document.getElementById('screen').insertAdjacentHTML('afterbegin','<button class="wide" onclick="go(\'counters\')">⚔️ Xem bảng khắc hệ & vai trò</button>')}if(page==='pve'||page==='arena'){document.getElementById('screen').insertAdjacentHTML('beforeend','<button class="wide" onclick="go(\'counters\')">🧮 Thử tính khắc chế (không tốn tài nguyên)</button>')}};render();
